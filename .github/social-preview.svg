<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafbfc"/>
      <stop offset="100%" stop-color="#f0f1f3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e07c24"/>
      <stop offset="100%" stop-color="#d4a04a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <g fill="#d8dbe0" opacity="0.5">
    <circle cx="80" cy="80" r="1.5"/><circle cx="160" cy="80" r="1.5"/>
    <circle cx="240" cy="80" r="1.5"/><circle cx="80" cy="160" r="1.5"/>
    <circle cx="160" cy="160" r="1.5"/><circle cx="240" cy="160" r="1.5"/>
    <circle cx="1040" cy="80" r="1.5"/><circle cx="1120" cy="80" r="1.5"/>
    <circle cx="1200" cy="80" r="1.5"/><circle cx="1040" cy="160" r="1.5"/>
    <circle cx="1120" cy="160" r="1.5"/><circle cx="1200" cy="160" r="1.5"/>
    <circle cx="1040" cy="560" r="1.5"/><circle cx="1120" cy="560" r="1.5"/>
    <circle cx="1200" cy="560" r="1.5"/><circle cx="80" cy="560" r="1.5"/>
    <circle cx="160" cy="560" r="1.5"/>
  </g>

  <!-- Chunking visual: large doc -> chunks -> synthesis -->
  <g transform="translate(860, 140)">
    <!-- Large document block -->
    <rect x="0" y="0" width="56" height="80" rx="4" fill="none" stroke="#b0b8c4" stroke-width="1.5"/>
    <line x1="10" y1="15" x2="46" y2="15" stroke="#c8cdd4" stroke-width="2"/>
    <line x1="10" y1="25" x2="40" y2="25" stroke="#c8cdd4" stroke-width="2"/>
    <line x1="10" y1="35" x2="46" y2="35" stroke="#c8cdd4" stroke-width="2"/>
    <line x1="10" y1="45" x2="34" y2="45" stroke="#c8cdd4" stroke-width="2"/>
    <line x1="10" y1="55" x2="46" y2="55" stroke="#c8cdd4" stroke-width="2"/>
    <line x1="10" y1="65" x2="38" y2="65" stroke="#c8cdd4" stroke-width="2"/>

    <!-- Arrow down -->
    <line x1="28" y1="88" x2="28" y2="120" stroke="#b0b8c4" stroke-width="1.5"/>
    <polyline points="22,114 28,122 34,114" fill="none" stroke="#b0b8c4" stroke-width="1.5"/>

    <!-- 3 chunk blocks -->
    <rect x="-20" y="130" width="32" height="28" rx="3" fill="none" stroke="#e07c24" stroke-width="1.5"/>
    <line x1="-13" y1="140" x2="5" y2="140" stroke="#e8a560" stroke-width="1.5"/>
    <line x1="-13" y1="148" x2="2" y2="148" stroke="#e8a560" stroke-width="1.5"/>

    <rect x="20" y="130" width="32" height="28" rx="3" fill="none" stroke="#e07c24" stroke-width="1.5"/>
    <line x1="27" y1="140" x2="45" y2="140" stroke="#e8a560" stroke-width="1.5"/>
    <line x1="27" y1="148" x2="42" y2="148" stroke="#e8a560" stroke-width="1.5"/>

    <rect x="60" y="130" width="32" height="28" rx="3" fill="none" stroke="#e07c24" stroke-width="1.5"/>
    <line x1="67" y1="140" x2="85" y2="140" stroke="#e8a560" stroke-width="1.5"/>
    <line x1="67" y1="148" x2="82" y2="148" stroke="#e8a560" stroke-width="1.5"/>

    <!-- Converging arrows -->
    <line x1="-4" y1="166" x2="20" y2="190" stroke="#b0b8c4" stroke-width="1.5"/>
    <line x1="36" y1="166" x2="28" y2="190" stroke="#b0b8c4" stroke-width="1.5"/>
    <line x1="76" y1="166" x2="36" y2="190" stroke="#b0b8c4" stroke-width="1.5"/>
    <polyline points="23,184 28,194 33,184" fill="none" stroke="#b0b8c4" stroke-width="1.5"/>

    <!-- Synthesis result -->
    <rect x="4" y="200" width="48" height="36" rx="4" fill="none" stroke="#3a8f6a" stroke-width="1.5"/>
    <line x1="12" y1="213" x2="44" y2="213" stroke="#6ab894" stroke-width="2"/>
    <line x1="12" y1="223" x2="38" y2="223" stroke="#6ab894" stroke-width="2"/>

    <!-- Labels -->
    <text x="110" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9098a8">Document</text>
    <text x="110" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e07c24">Chunks</text>
    <text x="110" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3a8f6a">Synthesis</text>
  </g>

  <!-- Text content -->
  <text x="100" y="250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="#1a1a2e" letter-spacing="-1">RLM-RS Plugin</text>
  <text x="100" y="305" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#5a6070">Recursive Language Model for Claude Code</text>

  <!-- Accent line -->
  <rect x="100" y="330" width="80" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Feature tags -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#6a7080">
    <text x="100" y="378">Chunk &amp; Conquer</text>
    <circle cx="218" cy="374" r="2" fill="#d0d4da"/>
    <text x="230" y="378">Hybrid Search</text>
    <circle cx="342" cy="374" r="2" fill="#d0d4da"/>
    <text x="354" y="378">Distributed Analysis</text>
    <circle cx="510" cy="374" r="2" fill="#d0d4da"/>
    <text x="522" y="378">Synthesis</text>
  </g>

  <!-- Bottom -->
  <text x="100" y="530" font-family="ui-monospace, 'SF Mono', monospace" font-size="15" fill="#8890a0">github.com/zircote/rlm-rs-plugin</text>
  <rect x="100" y="546" width="130" height="24" rx="4" fill="#b7410e" opacity="0.1"/>
  <text x="115" y="563" font-family="ui-monospace, 'SF Mono', monospace" font-size="13" fill="#b7410e">arXiv:2512.24601</text>
</svg>
